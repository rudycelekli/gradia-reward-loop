[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gradia-reward-loop"
version = "0.1.0"
description = "Pillar 4 of the Gradia program: reward hacking in the RL loop -- a training-time extension of the Reward-Hacking Wind Tunnel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rudy Celekli" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# the from-scratch toy PPO and the offline reward-hacking demo need only numpy.
real = ["torch>=2.2", "transformers>=4.44", "trl>=0.11", "datasets>=2.20", "peft>=0.11"]
gradia = ["gradia-wind-tunnel>=1.0.0"]  # reuse oracle / transforms / witnessed localization / evidence bundles
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
gradia-reward-loop = "gradia_reward_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gradia_reward_loop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F811"]
