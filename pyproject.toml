[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gradia-reward-loop"
version = "1.0.1"
description = "Oracle-witnessed reward-hacking experiments and a replay-verified paired GRPO diagnostic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rudy Celekli" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# the from-scratch toy PPO and the offline reward-hacking demo need only numpy.
real = ["torch>=2.2", "transformers>=4.44", "trl>=0.11", "datasets>=2.20", "peft>=0.11"]
gradia = [
  "gradia-wind-tunnel @ git+https://github.com/rudycelekli/gradia-wind-tunnel.git@fe3ca0c249f40879e75e82c455a25bb36d5f47d1"
]  # exact Pillar 3 oracle / transforms / localization / evidence primitives
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14", "matplotlib>=3.8"]

[project.scripts]
gradia-reward-loop = "gradia_reward_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gradia_reward_loop"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F811"]
